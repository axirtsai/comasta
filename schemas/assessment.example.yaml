# COMASTA Assessment Example
# Version: 0.2-draft
# Status: Experimental Specification - Not Yet Validated
#
# This example assesses current interpretive support. It does not predict
# what the character will do and is not an observed test result.

assessment:
  id: AS001
  references:
    character_id: C001
    candidate_action_id: A001

  target:
    type: action_interpretability
    candidate: Wei-Cheng directly confronts his father at the hospital.

  explicit_claims:
    - id: E2
      claim: Wei-Cheng has historically avoided direct confrontation with his father.
    - id: E4
      claim: Wei-Cheng still wants his father's approval.
    - id: E5
      claim: The relationship contains attachment.
    - id: E6
      claim: The relationship contains resentment.
    - id: E7
      claim: Their conflict remains unresolved.
    - id: E9
      claim: His father's condition may rapidly deteriorate.
    - id: E10
      claim: This may be his final meaningful opportunity to speak with his father.

  baseline_conflict:
    established_pattern: avoids direct confrontation with his father
    grounding: EXPLICIT
    depends_on: [E2]

  derived_claims:
    - id: D1
      claim: The opportunity for direct conversation may soon disappear.
      grounding: DERIVED
      depends_on: [E9, E10]
    - id: D2
      claim: Continued silence now carries the possibility that the unresolved relationship will remain permanently unaddressed.
      grounding: DERIVED
      depends_on: [E5, E6, E7, E9, E10]

  ungrounded_claims: []

  speculative_interpretations:
    - Wei-Cheng may hope for reconciliation.

  behavioral_bridge:
    bridge_origin:
      claim: He has historically avoided direct confrontation with his father.
      grounding: EXPLICIT
      depends_on: [E2]

    difference_making_condition:
      claim: The opportunity for direct conversation may soon disappear.
      grounding: DERIVED
      depends_on: [E9, E10]

    character_meaning:
      claim: The possible endpoint concerns an attached, resented, approval-relevant, and unresolved relationship.
      grounding: DERIVED
      depends_on: [E4, E5, E6, E7, E9, E10]

    action_link:
      claim: Direct confrontation addresses the supplied unresolved conflict before direct conversation may become unavailable.
      grounding: DERIVED
      depends_on: [E2, E6, E7, E9, E10]

    substitution_test:
      unrelated_action: Wei-Cheng steals an ambulance.
      result: pass
      explanation: The link specifically depends on addressing the father and their unresolved conflict; it does not explain ambulance theft.

    necessary_links_use_ungrounded_information: false
    status: "BRIDGE ESTABLISHED"
    gaps: []

  unresolved_tensions:
    - claim: Attachment and resentment remain simultaneously active.
      grounding: EXPLICIT
      depends_on: [E5, E6]
    - claim: The direct confrontation conflicts with the established avoidance pattern.
      grounding: EXPLICIT
      depends_on: [E2]

  open_unknowns:
    - Wei-Cheng's exact conscious motive remains unknown.
    - His father's immediate response remains unknown.

  epistemic_status: "SUFFICIENT FOR TARGET"
  assessment_disposition: ISSUED
  assessment_state: "PLAUSIBLE DEVIATION"

  non_inevitability_statement: >
    The current material makes confrontation interpretable. It does not
    predict that confrontation will occur, rank it as most likely, or
    exhaust other possible actions.

  author_questions: []
  authorial_decision_reserved: true
