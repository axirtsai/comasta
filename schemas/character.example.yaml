# COMASTA Character Input Example
# Version: 0.2-draft
# Status: Experimental Specification - Not Yet Validated

character:
  id: C001

  identity:
    name: Lin Wei-Cheng
    age: 38
    cultural_context: Taiwan

  history:
    explicit_claims:
      - id: E1
        claim: His father repeatedly made major decisions for him.
      - id: E2
        claim: He has historically avoided direct confrontation with his father.
      - id: E2A
        claim: He rarely discloses emotion directly during family conflict.
      - id: E3
        claim: He reduced contact but did not end the relationship.
      - id: E4
        claim: He still wants his father's approval, although he rarely admits it.

  behavioral_patterns:
    - id: B1
      pattern: avoids direct confrontation with his father
      grounding_claims: [E1, E2]
      deterministic: false
    - id: B2
      pattern: rarely discloses emotion directly in family conflict
      grounding_claims: [E2A]
      deterministic: false

  relationships:
    father:
      explicit_claims:
        - id: E5
          claim: The relationship contains attachment.
        - id: E6
          claim: The relationship contains resentment.
        - id: E7
          claim: Their conflict remains unresolved.

  current_state:
    emotional_state: unknown
    physical_state: unknown

situation:
  explicit_claims:
    - id: E8
      claim: His father has been hospitalized unexpectedly.
    - id: E9
      claim: Doctors say his father's condition may rapidly deteriorate.
    - id: E10
      claim: Wei-Cheng has been told this may be his final meaningful opportunity to speak with his father.

known_unknowns:
  - id: U1
    claim: Wei-Cheng's precise current emotional state is unknown.
    relevant_to:
      - expression_interpretability
  - id: U2
    claim: His father's attitude when Wei-Cheng enters is unknown.
    relevant_to:
      - action_interpretability
      - expression_interpretability
  - id: U3
    claim: Wei-Cheng's exact conscious motive is unknown.
    relevant_to:
      - action_interpretability

interpretive_scope:
  preserve_ambiguity:
    - U3
  note: The precise motive should remain unresolved.
  counts_as_behavioral_evidence: false

behavioral_policy:
  history_is_deterministic: false
  deviation_is_penalty: false
  contradiction_is_error: false
  unknown_may_be_silently_completed: false
  multiple_actions_may_be_interpretable: true
